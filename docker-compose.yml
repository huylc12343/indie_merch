services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: indie_merch
      POSTGRES_USER: indie_merch
      POSTGRES_PASSWORD: indie_merch_dev
    ports:
      - "5433:5432"
    volumes:
      - indie_merch_postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indie_merch -d indie_merch"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  indie_merch_postgres:
